<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apprentissage LSF</title>
    <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
    <header>
        <nav id="main-nav">
            <button class="btn-settings" id="btn-settings" onclick="toggleSettingsPanel()" aria-label="Reglages">
                &#9881;
            </button>
            <span id="nav-breadcrumb"><a href="#" onclick="showMenu()">Accueil</a></span>
            <button class="btn-results hidden" id="btn-results" onclick="showResultsPage()">Resultats</button>
        </nav>
    </header>

    <!-- Panneau de réglages -->
    <div id="settings-panel" class="settings-panel hidden">
        <h3 class="settings-title">Apparence</h3>
        <div class="theme-options">
            <button class="theme-card theme-clair-preview" onclick="setTheme('clair')">
                <span class="theme-swatch swatch-clair"></span>
                <span class="theme-label">Mode clair</span>
            </button>
            <button class="theme-card theme-sombre-preview" onclick="setTheme('sombre')">
                <span class="theme-swatch swatch-sombre"></span>
                <span class="theme-label">Mode sombre</span>
            </button>
            <button class="theme-card theme-ludique-preview" onclick="setTheme('ludique')">
                <span class="theme-swatch swatch-ludique"></span>
                <span class="theme-label">Mode coloré</span>
            </button>
        </div>
        <hr class="settings-separator">
        <h3 class="settings-title">Utilisateur</h3>
        <p class="settings-user-label">Connecté en tant que :</p>
        <p id="current-user-display" class="current-user-display">—</p>
        <button class="btn-change-user" onclick="resetIdentification()">Changer d'utilisateur</button>
    </div>

    <main id="app">
        <section id="menu-container"></section>
        <section id="exercise-container" class="hidden"></section>
    </main>

    <!-- Modal d'identification (s'affiche au premier lancement) -->
    <div id="identification-modal" class="modal-overlay ident-overlay">
        <div class="modal-content identification-card">
            <button id="btn-close-ident" class="btn-close-ident hidden" onclick="closeIdentModal()" aria-label="Fermer">✕</button>
            <h2 class="ident-title">Bienvenue !</h2>
            <p class="ident-subtitle">Identifie-toi avant de commencer.</p>

            <!-- Sélecteur de mode -->
            <div class="ident-mode-selector">
                <button class="ident-mode-btn active" id="btn-mode-eleve" onclick="switchIdentMode('eleve')">
                    Eleve
                </button>
                <button class="ident-mode-btn" id="btn-mode-classe" onclick="switchIdentMode('classe')">
                    Classe
                </button>
                <button class="ident-mode-btn" id="btn-mode-professeur" onclick="switchIdentMode('professeur')">
                    Professeur
                </button>
            </div>

            <!-- Formulaire élève -->
            <div id="form-eleve" class="ident-form">
                <label for="input-nom">Prenom</label>
                <input type="text" id="input-nom" placeholder="Ex : Pierre" maxlength="30"
                       onkeydown="if(event.key==='Enter') submitIdentification()">
                <label for="input-animal">Animal totem</label>
                <input type="text" id="input-animal" placeholder="Ex : Chat" maxlength="30"
                       onkeydown="if(event.key==='Enter') submitIdentification()">
                <label for="input-age">Âge</label>
                <input type="number" id="input-age" placeholder="Ex : 8" min="3" max="100"
                       onkeydown="if(event.key==='Enter') submitIdentification()">
            </div>

            <!-- Formulaire classe -->
            <div id="form-classe" class="ident-form hidden">
                <label for="input-classe">Nom de la classe</label>
                <input type="text" id="input-classe" placeholder="Ex : Classe B" maxlength="40"
                       onkeydown="if(event.key==='Enter') submitIdentification()">
            </div>

            <!-- Formulaire professeur -->
            <div id="form-professeur" class="ident-form hidden">
                <label for="input-password">Mot de passe</label>
                <input type="password" id="input-password" placeholder="••••••••••••"
                       onkeydown="if(event.key==='Enter') submitIdentification()">
            </div>

            <p id="ident-error" class="ident-error hidden">Veuillez remplir tous les champs.</p>

            <button class="btn-play ident-submit" onclick="submitIdentification()">Commencer</button>
        </div>
    </div>

    <script src="script.js?v=1"></script>

    <!-- Modal de fin d'exercice -->
    <div id="finish-modal" class="modal-overlay hidden">
        <div class="modal-content finish-card">
            <h2>Défi terminé !</h2>
            <div id="finish-message"></div>
            <div class="finish-actions">
                <button class="btn-variant" onclick="restartCurrentExercise()">Refaire le défi</button>
                <button class="btn-variant" onclick="goToSubMenu()">Faire un autre défi</button>
                <button class="btn-play" onclick="goToHome()">Revenir a l'accueil</button>
            </div>
        </div>
    </div>
</body>
</html>
